<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Activar cuenta · Factura Electrónica</title><link rel="stylesheet" href="auth.css"><script src="invite.js" defer></script></head><body class="auth-page"><main class="auth-shell"><section class="auth-card"><p class="eyebrow">Invitación segura</p><h1>Activa tu cuenta</h1><p id="invitation-detail" class="subtitle">Validando invitación…</p><form id="invite-form" hidden><div class="field"><label for="invite-password">Contraseña</label><input id="invite-password" name="password" type="password" minlength="12" maxlength="72" autocomplete="new-password" required></div><div class="field"><label for="invite-confirmation">Confirmar contraseña</label><input id="invite-confirmation" name="passwordConfirmation" type="password" minlength="12" maxlength="72" autocomplete="new-password" required></div><p class="password-hint">Usa al menos 12 caracteres, mayúscula, minúscula, número y símbolo.</p><p class="form-message" role="alert"></p><button class="submit-button" type="submit">Activar cuenta</button></form></section></main></body></html>
