<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Nueva contraseña · Factura Electrónica</title><link rel="stylesheet" href="auth.css"><link rel="stylesheet" href="login-reference.css"><script src="password-recovery.js" defer></script></head><body class="login-page"><main class="login-stage"><section class="login-panel"><header class="login-brand"><span class="login-brand-mark">FE</span><span>Factura Electrónica</span></header><div class="login-content"><p class="login-kicker">Enlace de recuperación</p><h1>Define una nueva contraseña</h1><p id="reset-detail" class="login-subtitle">Validando enlace…</p><form id="reset-form" hidden><div class="login-field"><div><label for="reset-password">Nueva contraseña</label><input id="reset-password" name="password" type="password" minlength="12" maxlength="72" autocomplete="new-password" required></div></div><div class="login-field"><div><label for="reset-confirmation">Confirmar contraseña</label><input id="reset-confirmation" name="passwordConfirmation" type="password" minlength="12" maxlength="72" autocomplete="new-password" required></div></div><p class="password-hint">Incluye mayúscula, minúscula, número y símbolo.</p><p class="form-message" role="alert"></p><button class="login-button" type="submit">Cambiar contraseña</button></form></div></section></main></body></html>
